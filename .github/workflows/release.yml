# Builds the plugin and drafts a GitHub release when a version tag is pushed
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write # Needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      # Draft, so it can be checked before publishing; Obsidian needs the three files as separate assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --draft \
            main.js manifest.json styles.css
